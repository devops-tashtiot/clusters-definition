# Environment-specific overrides for External Secrets Operator v2.7.0.
# Merged on top of clusters-provision/clusters/external-secrets-operator/values.yaml by ArgoCD.

wrapper:
  awsParameterStore:
    region: "il-central-1"

# IRSA — on EKS the controller reads SSM Parameter Store via an IAM role
# scoped to just this ServiceAccount (least-privilege), not a node-wide IMDS
# role like the old Minikube EC2 instance used. The EKS Pod Identity webhook
# injects AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE into the pod automatically
# once this annotation is present — no explicit auth: block needed on the
# ClusterSecretStore, it's picked up by the AWS SDK's default credential
# chain. Role created in devtools-labs/terraform/modules/eks/iam.tf.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::342831714456:role/devtools-eks-external-secrets-ccc5ba7fe5d15756f8d5dc94eb"
